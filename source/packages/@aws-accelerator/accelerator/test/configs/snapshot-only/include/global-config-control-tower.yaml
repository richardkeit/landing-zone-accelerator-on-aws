enable: true
landingZone:
  version: '3.3'
  logging:
    loggingBucketRetentionDays: 365
    accessLoggingBucketRetentionDays: 365
    organizationTrail: true
  security:
    enableIdentityCenterAccess: true
controls:
  - identifier: AWS-GR_RESTRICT_ROOT_USER_ACCESS_KEYS
    enable: true
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
  - identifier: AWS-GR_EBS_OPTIMIZED_INSTANCE
    enable: true
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
  - identifier: AWS-GR_RESTRICTED_COMMON_PORTS
    enable: false
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
  - identifier: AWS-GR_RDS_SNAPSHOTS_PUBLIC_PROHIBITED
    enable: false
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
  - identifier: 6s095tcdtgab75dd0229m5x6n
    enable: true
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
  # Demonstrates the optional `parameters` field. CT.EC2.PV.5 denies the EC2
  # VM Import/Export APIs and accepts a single optional parameter,
  # ExemptedPrincipalArns, used to whitelist principals from the deny.
  - identifier: CT.EC2.PV.5
    enable: true
    deploymentTargets:
      organizationalUnits:
        - SecureWorkloads
    parameters:
      - key: ExemptedPrincipalArns
        value:
          - arn:aws:iam::*:role/VMImportExportAdmin