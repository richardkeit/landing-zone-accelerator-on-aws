Description: (SO0199-moduleinfrastructure) Landing Zone Accelerator on AWS - Module Infrastructure Resources. Version 1.15.0-rc.7.
Parameters:
  AcceleratorPrefix:
    Type: String
    Default: 'AWSAccelerator'
    Description: Prefix for accelerator resources

Resources:
  ModuleStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AcceleratorPrefix}-Module-State-${AWS::AccountId}-${AWS::Region}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Accelerator
          Value: !Ref AcceleratorPrefix
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

  ResourceRetentionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AcceleratorPrefix}-Resource-Retention-${AWS::AccountId}-${AWS::Region}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      Tags:
        - Key: Accelerator
          Value: !Ref AcceleratorPrefix
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

  VerboseLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${AcceleratorPrefix}-Module-Verbose-Logs'
      RetentionInDays: 30
      Tags:
        - Key: Accelerator
          Value: !Ref AcceleratorPrefix
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

Outputs:
  ModuleStateTableName:
    Description: The name of the DynamoDB table for module execution state
    Value: !Ref ModuleStateTable
  
  ResourceRetentionTableName:
    Description: The name of the DynamoDB table for custom resource retention state
    Value: !Ref ResourceRetentionTable
  
  VerboseLogsGroupName:
    Description: The name of the CloudWatch log group for verbose module logs
    Value: !Ref VerboseLogsGroup
